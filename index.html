<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FALCONS — Панель управления</title>
<style>
:root{--bg:#070811;--panel:#0c0d19;--line:#242239;--muted:#9294b3;--text:#eef0ff;--purple:#782cff;--purple2:#a35cff;--green:#21e6a0;--red:#ff4d6d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% 0%,#20103b 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,Arial,sans-serif}
button{font:inherit;cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.side{padding:22px 15px;border-right:1px solid var(--line);background:#080914;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:0 12px 28px}.bird{font-size:35px;color:var(--purple2);filter:drop-shadow(0 0 12px #782cff)}
.brand b{font-size:22px;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}
.nav{display:grid;gap:7px}.nav button{border:0;color:#bcbdd6;background:transparent;text-align:left;padding:13px 14px;border-radius:10px;display:flex;gap:12px;align-items:center}
.nav button:hover,.nav button.active{background:linear-gradient(100deg,#4e1a9e,#29144f);color:white}
.ico{width:21px;text-align:center;font-size:18px}
.sidefoot{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:15px;color:var(--muted);font-size:12px}
.main{min-width:0}.top{height:67px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 28px;background:#090914c9}
.pill{padding:10px 13px;border:1px solid #38265a;border-radius:9px;background:#111020;color:#eee}
.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#3b1769;border:1px solid #a35cff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.content{padding:27px;max-width:1600px;margin:auto}
.hero{padding:26px;border-radius:16px;border:1px solid #292044;background:linear-gradient(110deg,#111020f2 0%,#151025e8 50%,#241044c9 100%);position:relative;overflow:hidden;margin-bottom:20px}
.hero:after{content:'🦅';position:absolute;right:38px;top:-34px;font-size:155px;opacity:.13;transform:rotate(-12deg)}
h1{margin:0 0 7px;font-size:29px}h1 span{color:var(--purple2)}p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:14px;margin-bottom:16px}
.card{background:linear-gradient(145deg,#0e0f1c,#090a14);border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}
.stat-icon{color:var(--purple2);font-size:23px}.label{color:#a6a7c3;font-size:12px;margin-top:12px}
.num{font-size:28px;font-weight:700;margin:2px 0}.sub{color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:1.35fr .9fr .8fr;gap:15px}
.card h2{font-size:16px;margin:0 0 18px}
.rowitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1d1d30;flex-wrap:wrap}
.rowitem:last-child{border-bottom:0}
.tag{font-size:11px;border-radius:20px;padding:5px 9px;background:#321765;color:#d8c5ff;text-decoration:none;white-space:nowrap}
a.tag:hover{background:#4a2390}
.btn{border:0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:#fff}
.btn.accept{background:#1a7a4f}.btn.accept:hover{background:#22a86a}
.btn.reject{background:#7a1a2c}.btn.reject:hover{background:#a8223a}
.btn.call{background:#2a3a8a}.btn.call:hover{background:#3d52b8}
.btn.close{background:#3a3a4a}.btn.close:hover{background:#55556a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ticket-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{width:100%;text-align:left;background:#111020;border:1px solid #25213c;color:#e8e5ff;border-radius:8px;padding:11px;margin:4px 0}
.quick button:hover{border-color:var(--purple2);background:#1b1031}
.page{display:none}.page.active{display:block}
.setting{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);gap:10px}
.setting:last-child{border-bottom:0}
.empty{margin:16px 0 4px;padding:18px;border:1px dashed #2d2a47;border-radius:10px;color:#7f809d;font-size:12px;line-height:1.5}
.mutednote{font-size:11px;color:#7f809d;margin-top:20px}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.logincard{width:100%;max-width:380px;text-align:center;padding:30px}
.loginbtn{display:inline-block;background:linear-gradient(100deg,#4e1a9e,#782cff);color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:10px}
.loginbtn:hover{filter:brightness(1.12)}
.toast{position:fixed;right:22px;bottom:22px;background:#1a1230;border:1px solid #7540c8;border-radius:10px;padding:13px 18px;display:none;box-shadow:0 10px 35px #0008;z-index:9999;max-width:400px}
.dim{color:#6b6c88}
.tk-stale{color:#ffbd59;font-size:11px;margin:4px 0 8px}
[hidden]{display:none!important}
button:focus-visible,a:focus-visible{outline:2px solid var(--purple2);outline-offset:2px}
.tag.st-ok{background:#0f3b2c;color:#6ff2c0}.tag.st-no{background:#2a2540;color:#a9a6c9}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{padding:12px;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.sidefoot{display:none}.content{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.hero:after{right:0;font-size:100px}h1{font-size:23px}}
</style></head><body>

<div class="loginwrap" id="loginScreen" hidden>
  <div class="card logincard">
    <div class="brand" style="justify-content:center;padding:0 0 18px"><div class="bird">➤</div><div><b>FALCONS</b><small>ПАНЕЛЬ УПРАВЛЕНИЯ</small></div></div>
    <p id="loginMsg">Войдите через Discord, чтобы открыть панель.</p>
    <a class="loginbtn" href="/auth/discord">Войти через Discord</a>
  </div>
</div>

<div class="app" id="app" hidden>
<aside class="side">
  <div class="brand"><div class="bird">➤</div><div><b>FALCONS</b><small>ПАНЕЛЬ УПРАВЛЕНИЯ</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="home"><span class="ico">⌂</span>Главная</button>
    <button data-page="tickets"><span class="ico">▤</span>Тикеты</button>
    <button data-page="apps"><span class="ico">▣</span>Заявки в клан</button>
    <button data-page="logs"><span class="ico">◷</span>Логи</button>
    <button data-page="members"><span class="ico">♟</span>Роли и участники</button>
    <button data-page="invites"><span class="ico">↗</span>Инвайты</button>
    <button data-page="moderation"><span class="ico">⬡</span>Модерация</button>
    <button data-page="stats"><span class="ico">▥</span>Статистика</button>
    <button data-page="settings"><span class="ico">⚙</span>Настройки</button>
    <button data-page="roles"><span class="ico">♛</span>Роли и права</button>
  </nav>
  <div class="sidefoot">🦅 <b style="color:#eee">Falcons Bot</b><br><br>Панель<br><span style="color:#a35cff">♥</span> Сделано для Falcons</div>
</aside>
<main class="main">
<header class="top">
  <div class="avatar" id="avatar">?</div>
  <div><b id="userName">…</b><div class="sub" id="userRole">Вход через Discord</div></div>
  <button class="pill" onclick="logout()">Выйти</button>
</header>
<div class="content">
