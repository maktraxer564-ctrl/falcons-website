<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALCONS — Панель управления v0.2</title>

    <style>
        :root {
            --bg-dark: #0f0f13;
            --panel-bg: #14141c;
            --accent-purple: #7d5fff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --border-color: #2f3542;
            --success-green: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent-purple);
            object-fit: cover;
        }

        .logout-btn,
        .login-btn {
            background-color: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .logout-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .logout-btn:hover {
            border-color: #ff4757;
            color: #ff4757;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--accent-purple);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
        }

        .info-box {
            background: rgba(125, 95, 255, 0.05);
            border: 1px solid rgba(125, 95, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .info-desc {
            font-size: 14px;
            color: var(--text-muted);
        }

        .status-badge {
            background-color: rgba(46, 213, 115, 0.1);
            color: var(--success-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(46, 213, 115, 0.2);
        }

        @media (max-width: 600px) {
            body {
                padding: 16px 10px;
            }

            .dashboard-container {
                padding: 22px 16px;
            }

            h1 {
                font-size: 23px;
            }

            .user-panel {
                flex-wrap: wrap;
                border-radius: 12px;
            }

            .stat-value {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <div class="header-section">
            <h1>🦅 FALCONS PANEL</h1>

            <div id="auth-area">
                <a href="/auth/discord" class="login-btn">
                    Войти через Discord
                </a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Участников сервера</div>
                <div class="stat-value" id="total-members-count">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Онлайн сейчас</div>
                <div class="stat-value" id="online-members-count">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Участники клана</div>
                <div class="stat-value" id="clan-members-count">0</div>
            </div>
        </div>

        <div class="info-box">
            <div>
                <div class="info-title">Интеграция с Discord-ботом FLCN</div>
                <div class="info-desc" id="info-desc-text">
                    Ожидание статистики от Discord-бота.
                </div>
            </div>

            <div class="status-badge" id="bot-status">
                🟡 Ожидание данных...
            </div>
        </div>
    </div>

    <script>
        let currentUserId = null;

        async function initDashboard() {
            try {
                const response = await fetch('/api/me', {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('API вернул ошибку: ' + response.status);
                }

                const data = await response.json();
                const authArea = document.getElementById('auth-area');

                if (data.authenticated && data.user) {
                    if (currentUserId !== data.user.id) {
                        currentUserId = data.user.id;

                        const userPanel = document.createElement('div');
                        userPanel.className = 'user-panel';

                        if (data.user.avatar_url) {
                            const avatar = document.createElement('img');
                            avatar.src = data.user.avatar_url;
                            avatar.className = 'avatar';
                            avatar.alt = 'Аватар Discord';
                            userPanel.appendChild(avatar);
                        }

                        const username = document.createElement('span');
                        username.style.fontWeight = '600';
                        username.textContent = data.user.global_name || data.user.username;

                        const logoutButton = document.createElement('button');
                        logoutButton.className = 'logout-btn';
                        logoutButton.textContent = 'Выйти';
                        logoutButton.addEventListener('click', logout);

                        userPanel.appendChild(username);
                        userPanel.appendChild(logoutButton);

                        authArea.innerHTML = '';
                        authArea.appendChild(userPanel);
                    }
                }

                // ОБНОВЛЕНИЕ ЭКРАНА СТАТИСТИКИ (ПОЛЯ: total, online, clan)
                if (data.stats) {
                    document.getElementById('total-members-count').innerText = Number(data.stats.total || 0).toLocaleString();
                    document.getElementById('online-members-count').innerText = Number(data.stats.online || 0).toLocaleString();
                    document.getElementById('clan-members-count').innerText = Number(data.stats.clan || 0).toLocaleString();
                    
                    const statusBadge = document.getElementById('bot-status');
                    const descText = document.getElementById('info-desc-text');
                    
                    if (data.stats.total > 0) {
                        statusBadge.innerText = "🟢 Мост: LIVE";
                        statusBadge.style.backgroundColor = "rgba(46, 213, 115, 0.1)";
                        statusBadge.style.color = "var(--success-green)";
                        descText.innerText = "Статистика успешно синхронизирована в реальном времени с сервером Discord.";
                    } else {
                        statusBadge.innerText = "🟡 Ожидание данных...";
                        statusBadge.style.backgroundColor = "rgba(255, 159, 67, 0.1)";
                        statusBadge.style.color = "#ff9f43";
                        descText.innerText = "Бот успешно подключён, ожидает первый цикл обновления счётчиков (до 10 минут).";
                    }
                }
            } catch (error) {
