<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALCONS — Панель управления</title>

    <style>
        :root {
            --bg-dark: #0f0f13;
            --panel-bg: #14141c;
            --accent-purple: #7d5fff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --border-color: #2f3542;
            --success-green: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent-purple);
            object-fit: cover;
        }

        .login-btn,
        .logout-btn {
            background: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
            font-size: 14px;
        }

        .login-btn:hover,
        .logout-btn:hover {
            opacity: 0.85;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-purple);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
        }

        .info-box {
            background: rgba(125, 95, 255, 0.05);
            border: 1px solid rgba(125, 95, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .info-desc {
            font-size: 14px;
            color: var(--text-muted);
        }

        .status-badge {
            background: rgba(255, 159, 67, 0.1);
            color: #ff9f43;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 159, 67, 0.2);
        }

        @media (max-width: 600px) {
            body {
                padding: 16px 10px;
            }

            .dashboard-container {
                padding: 22px 16px;
            }

            h1 {
                font-size: 23px;
            }

            .user-panel {
                flex-wrap: wrap;
                border-radius: 12px;
            }

            .stat-value {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="dashboard-container">
        <header class="header-section">
            <h1>🦅 FALCONS PANEL</h1>

            <div id="auth-area">
                <a href="/auth/discord" class="login-btn">
                    Войти через Discord
                </a>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Участников сервера</div>
                <div class="stat-value" id="total-members-count">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Онлайн сейчас</div>
                <div class="stat-value" id="online-members-count">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Участники клана</div>
                <div class="stat-value" id="clan-members-count">0</div>
            </div>
        </section>

        <section class="info-box">
            <div>
                <div class="info-title">
                    Интеграция с Discord-ботом FLCN
                </div>
                <div class="info-desc" id="info-desc-text">
                    Ожидание статистики от Discord-бота.
                </div>
            </div>

            <div class="status-badge" id="bot-status">
                🟡 Ожидание данных...
            </div>
        </section>
    </main>

    <script>
        let currentUserId = null;

        async function initDashboard() {
            try {
                const response = await fetch('/api/me', {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('Ошибка API: ' + response.status);
                }

                const data = await response.json();
                const authArea = document.getElementById('auth-area');

                if (data.authenticated && data.user) {
                    if (currentUserId !== data.user.id) {
                        currentUserId = data.user.id;
                        authArea.replaceChildren();

                        const userPanel = document.createElement('div');
                        userPanel.className = 'user-panel';

                        if (data.user.avatar_url) {
                            const avatar = document.createElement('img');
                            avatar.src = data.user.avatar_url;
                            avatar.className = 'avatar';
                            avatar.alt = 'Аватар Discord';
                            userPanel.appendChild(avatar);
                        }

                        const username = document.createElement('span');
                        username.style.fontWeight = '600';
                        username.textContent =
                            data.user.global_name ||
                            data.user.username ||
                            'Пользователь Discord';

                        const logoutButton = document.createElement('button');
                        logoutButton.className = 'logout-btn';
                        logoutButton.textContent = 'Выйти';
                        logoutButton.addEventListener('click', logout);

                        userPanel.appendChild(username);
                        userPanel.appendChild(logoutButton);
                        authArea.appendChild(userPanel);
                    }
                } else {
                    currentUserId = null;
                    authArea.innerHTML = `
                        <a href="/auth/discord" class="login-btn">
                            Войти через Discord
                        </a>
                    `;
                }

                if (data.stats) {
                    const total = Number(data.stats.total) || 0;
                    const online = Number(data.stats.online) || 0;
                    const clan = Number(data.stats.clan) || 0;

                    document.getElementById('total-members-count').textContent =
                        total.toLocaleString('ru-RU');

                    document.getElementById('online-members-count').textContent =
                        online.toLocaleString('ru-RU');

                    document.getElementById('clan-members-count').textContent =
                        clan.toLocaleString('ru-RU');

                    const statusBadge =
                        document.getElementById('bot-status');
                    const descText =
                        document.getElementById('info-desc-text');

                    if (total > 0) {
                        statusBadge.textContent = '🟢 Мост: LIVE';
                        statusBadge.style.backgroundColor =
                            'rgba(46, 213, 115, 0.1)';
                        statusBadge.style.color = 'var(--success-green)';
                        statusBadge.style.borderColor =
                            'rgba(46, 213, 115, 0.2)';

                        descText.textContent =
                            'Статистика получена от Discord-бота.';
                    } else {
                        statusBadge.textContent = '🟡 Ожидание данных...';
                        statusBadge.style.backgroundColor =
                            'rgba(255, 159, 67, 0.1)';
                        statusBadge.style.color = '#ff9f43';
                        statusBadge.style.borderColor =
                            'rgba(255, 159, 67, 0.2)';

                        descText.textContent =
                            'Сайт ожидает первую статистику от Discord-бота.';
                    }
                }
            } catch (error) {
                console.error('Ошибка загрузки панели:', error);
                document.getElementById('info-desc-text').textContent =
                    'Не удалось загрузить данные. Обнови страницу позже.';
            }
        }

        async function logout() {
            try {
                const response = await fetch('/auth/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    throw new Error('Ошибка выхода: ' + response.status);
                }

                currentUserId = null;
                await initDashboard();
            } catch (error) {
                console.error('Ошибка выхода:', error);
                alert('Не удалось выйти. Попробуй обновить страницу.');
            }
        }

        initDashboard();
        setInterval(initDashboard, 15000);
    </script>
</body>
</html>
